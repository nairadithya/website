name: Check links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run build
      - name: Check built pages
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config lychee.toml
            --root-dir '${{ github.workspace }}/dist'
            --remap '^https?://(www\.)?adithyanair\.com(?:/|$)(.*) file://${{ github.workspace }}/dist/$2'
            'dist/**/*.html'
          fail: true
          failIfEmpty: true
          output: lychee/report.md
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: lychee/report.md
          if-no-files-found: ignore
