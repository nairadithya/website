# Scan generated HTML even though dist/ is gitignored.
no_ignore = true
no_progress = true

# Astro generates /page/index.html for routes such as /page and /page/.
index_files = ["index.html"]

# Threadlocked navigation redirects to member sites that may be unreachable.
exclude = ['^https?://ring\.seggs\.lol(?:[/?#]|$)']

# Bound network checks and retry transient failures.
timeout = 20
max_retries = 2
max_concurrency = 8
host_concurrency = 2

# Tolerate automated-client blocking (403, LinkedIn's 999) and rate limits
# (429). These responses cannot establish whether the page exists, but should
# not cause false 404 alarms. Missing pages (404/410) and network errors fail.
accept = ["200..=299", "403", "429", "999"]
