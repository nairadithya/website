# Scan generated HTML even though dist/ is gitignored.
no_ignore = true
no_progress = true

# Astro generates /page/index.html for routes such as /page and /page/.
index_files = ["index.html"]

# Threadlocked navigation redirects to member sites that may be unreachable.
exclude = ['^https?://ring\.seggs\.lol(?:[/?#]|$)']

# Bound network checks and retry transient failures.
timeout = 20
accept_timeouts = true
max_retries = 2
max_concurrency = 8
host_concurrency = 2

# Only HTTP 404 responses indicate links we want to investigate.
# Accept other HTTP responses, including blocking, rate limits, and server errors.
accept = ["100..=403", "405..=599", "999"]
